# Automated semantic-version releases from Conventional Commits.
#
# On every push to main, release-please maintains a "release PR" that
# accumulates the changelog + next version from the conventional-commit
# history. Merging that PR tags the release (vMAJOR.MINOR.PATCH) and
# publishes a GitHub Release; the `release-binaries` job then attaches the service built
# for every platform in the Makefile, plus a checksums file, and the
# `release-image` job pushes the container image to the GitHub registry. The first release
# is pinned to 0.1.0 by `initial-version` in release-please-config.json —
# without it the first feature-bearing release would be 1.0.0 regardless of
# commit types.
#
# BRANCH-PROTECTION NOTE (read before cutting the first release):
# The release PR is opened with GITHUB_TOKEN by default, and GitHub does
# not trigger workflows for GITHUB_TOKEN-authored events — so the required
# checks will NOT run on the release PR on their own, and it cannot merge
# until they do. Until a RELEASE_PLEASE_TOKEN secret is added (see below), a
# maintainer must close and reopen the release PR once: reopening it as a real
# user fires the pull_request event and CI runs. See RELEASING.md.
#
# ONE-LINE UPGRADE (optional, removes the manual step):
# Add a RELEASE_PLEASE_TOKEN repo secret — a fine-grained PAT or GitHub App
# token with `contents: write` + `pull_requests: write`. The token
# expression below picks it up automatically; no workflow edit needed. The
# release PR is then authored by that identity, so CI runs normally and the
# flow is a plain CI-green + approvals merge like any other PR.

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Uses the optional RELEASE_PLEASE_TOKEN secret when present (so the
          # release PR triggers CI), else falls back to the built-in token
          # (needs the one-time close/reopen per the note above).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Drive release-please from committed files rather than inline inputs,
          # so the release type and the pre-1.0 versioning policy are reviewable
          # in the diff like any other change.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: make dist VERSION="$TAG"
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Attach to the release
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}

  release-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The standard OCI labels and annotations (source, revision, version,
      # created, title, description, licenses), taken from the workflow
      # context. The source entry is what connects the package to this
      # repository. The run is a push to main, so the version is set to the
      # release tag rather than derived from the ref.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          labels: |
            org.opencontainers.image.version=${{ needs.release-please.outputs.tag_name }}
          annotations: |
            org.opencontainers.image.version=${{ needs.release-please.outputs.tag_name }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.release-please.outputs.tag_name }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/${{ github.repository }}:latest
